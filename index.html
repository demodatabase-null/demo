<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบยื่นคำร้องขอตรวจสอบเกรด</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3f6f9; --grid:#e1e7ee; --surface:#ffffff; --surface2:#f7f9fb;
  --ink:#14213d; --muted:#5d6b82; --line:#d5dde7;
  --accent:#14213d; --accent-ink:#ffffff; --focus:#1769e0;
  --pk:#d62d2d; --fk:#1769e0;
  --s-pending-bg:#fdf1d6; --s-pending:#8a5a00;
  --s-review-bg:#dfeafd; --s-review:#124fa8;
  --s-ok-bg:#dcf3e4; --s-ok:#13683a;
  --s-no-bg:#fbe0e0; --s-no:#a11f1f;
  --shadow:0 1px 0 rgba(20,33,61,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1521; --grid:#18212f; --surface:#161e2d; --surface2:#1b2536;
    --ink:#e8edf6; --muted:#9aa8bf; --line:#2a364b;
    --accent:#e8edf6; --accent-ink:#0f1521; --focus:#6aa4ff;
    --pk:#ff6b6b; --fk:#6aa4ff;
    --s-pending-bg:#3a2f12; --s-pending:#f2c76a;
    --s-review-bg:#15294a; --s-review:#8db8ff;
    --s-ok-bg:#12331f; --s-ok:#7fd6a2;
    --s-no-bg:#3b1a1a; --s-no:#ff9a9a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1521; --grid:#18212f; --surface:#161e2d; --surface2:#1b2536;
  --ink:#e8edf6; --muted:#9aa8bf; --line:#2a364b;
  --accent:#e8edf6; --accent-ink:#0f1521; --focus:#6aa4ff;
  --pk:#ff6b6b; --fk:#6aa4ff;
  --s-pending-bg:#3a2f12; --s-pending:#f2c76a;
  --s-review-bg:#15294a; --s-review:#8db8ff;
  --s-ok-bg:#12331f; --s-ok:#7fd6a2;
  --s-no-bg:#3b1a1a; --s-no:#ff9a9a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.6;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
pre{margin:0;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow-x:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.role{border:1.5px solid var(--ink);padding:0 8px;border-radius:4px;font-size:12px;font-weight:600}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:500;transition:background .15s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.ok{background:var(--s-ok);color:#fff;border-color:var(--s-ok)}
.btn.no{background:var(--s-no);color:#fff;border-color:var(--s-no)}
.btn.ghost{border-color:var(--line)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--pk);color:#fff;font-size:12px;text-align:center}
main{padding:22px 0 60px}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.h-row h2{font-size:21px}
.h-row p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* panels */
.panel{background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;font-size:13px;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-pending{background:var(--s-pending-bg);color:var(--s-pending)}
.p-reviewing{background:var(--s-review-bg);color:var(--s-review)}
.p-approved{background:var(--s-ok-bg);color:var(--s-ok)}
.p-rejected{background:var(--s-no-bg);color:var(--s-no)}
.p-cancelled{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.p-cs1{background:var(--s-review-bg);color:var(--s-review)}
.p-cs2{background:var(--s-ok-bg);color:var(--s-ok)}
.p-cs3{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.grade{font-weight:700;font-size:16px}
.old-g{text-decoration:line-through;color:var(--muted);font-weight:600}
.new-g{color:var(--s-ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start;padding:44px 0}
@media(max-width:820px){.login{grid-template-columns:1fr;padding:22px 0}}
.login h1{font-size:34px;margin-bottom:10px}
.login .lead{color:var(--muted);max-width:44ch;margin:0 0 18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:16px}
.k-pk{color:var(--pk);font-weight:700}.k-fk{color:var(--fk);font-weight:700}
.card{padding:20px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input[type=text],input[type=password],select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface)}
textarea{min-height:96px;resize:vertical}
.demo{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.demo p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.demo .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.err{color:var(--s-no);font-size:13px;margin-top:8px;min-height:18px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,15,28,.55);display:none;align-items:flex-start;justify-content:center;padding:max(18px,env(safe-area-inset-top,0px)) 14px 18px;overflow-y:auto;z-index:50}
.ov.on{display:flex}
.modal{background:var(--surface);border:2px solid var(--ink);border-radius:10px;width:min(680px,100%);padding:20px;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.modal h3{font-size:19px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sec{margin-top:16px}
.sec h4{margin:0 0 6px;font-size:14px}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface2)}
.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 10px 18px;font-size:14px;border-left:2px solid var(--line)}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.tl li:last-child{border-left-color:transparent}
.tl .by{color:var(--muted);font-size:12.5px}
.files{display:flex;gap:6px;flex-wrap:wrap}
.file{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:13px}
.file button{border:0;background:none;cursor:pointer;color:var(--s-no);font-weight:700}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.radios{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0}
.radios label{display:flex;gap:6px;align-items:center;font-weight:500;margin:0}
.hidden{display:none!important}
.steps{display:flex;gap:6px;margin:12px 0 4px}
.step{flex:1;border:1.5px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;color:var(--muted);text-align:center}
.step.done{border-color:var(--s-ok);background:var(--s-ok-bg);color:var(--s-ok);font-weight:600}
.step.now{border-color:var(--ink);background:var(--surface2);color:var(--ink);font-weight:600}
.step.bad{border-color:var(--s-no);background:var(--s-no-bg);color:var(--s-no);font-weight:600}
.errbox{border:1.5px solid var(--s-no);background:var(--s-no-bg);color:var(--s-no);border-radius:8px;padding:12px 14px;margin-top:12px}
.errbox b{display:block;margin-bottom:4px}
.errbox pre{background:var(--surface);color:var(--ink);margin-top:8px}

/* notifications */
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.notif:last-child{border-bottom:0}
.notif.unread{background:var(--s-review-bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pk);margin-top:8px;flex:none}
.notif:not(.unread) .dot{background:var(--line)}

/* DB / ER / SQL */
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.th-badge{font-size:10.5px;font-weight:700;margin-right:5px}
.th-badge.pk{color:var(--pk)}.th-badge.fk{color:var(--fk)}
tr.r-new td{background:var(--s-ok-bg)}
tr.r-chg td{background:var(--s-pending-bg)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--surface);border:1px solid currentColor}
tr.r-new .tag{color:var(--s-ok)}tr.r-chg .tag{color:var(--s-pending)}
.dchip{margin-left:6px;font-size:11.5px;font-weight:700;color:var(--s-ok)}
.chip[aria-pressed="true"] .dchip{color:inherit}
.ent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ent{padding:12px 14px}
.ent h3{font-size:15px;margin-bottom:6px;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.ent ul{list-style:none;margin:0;padding:0;font-size:13.5px}
.ent li{padding:1px 0}
.rel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.rel:last-child{border-bottom:0}
.rel .a{text-align:right;font-weight:600}.rel .c{font-weight:700;white-space:nowrap}
.rel small{display:block;color:var(--muted);font-weight:400}
.sqlcard{margin-bottom:12px;padding:12px 14px}
.sqlcard .hd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.sqlcard .hd b{font-size:14.5px}
.sqlcard .who{color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:8px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
.toast.on{opacity:1}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0 30px}
footer button{border:0;background:none;text-decoration:underline;cursor:pointer;color:inherit}
</style>
</head>

async function loadRemoteData(){
 const entries=await Promise.all(Object.entries(REMOTE_TABLES).map(async([name,table])=>{

   return [name,(data||[]).map(row=>fromRemote(name,row))];
 }));
 DB=Object.fromEntries(entries); BASE=JSON.parse(JSON.stringify(DB)); SQL=[];

const csPill = id => `<span class="pill p-cs${id}">${esc(get('course_status',id).status_name)}</span>`;

/* ---- SQL builder / transaction log ---- */
const q = v => v===null||v===undefined ? 'NULL' : typeof v==='number' ? String(v) : typeof v==='boolean' ? (v?'TRUE':'FALSE') : `'${String(v).replace(/'/g,"''")}'`;
const insSql = (t,row) => `INSERT INTO ${t} (${Object.keys(row).join(', ')})\nVALUES (${Object.values(row).map(q).join(', ')});`;
function beginTx(){TX=['START TRANSACTION;']}
function rec(s){if(TX)TX.push(s)}
function endTx(title,ok=true,note=''){
  if(!TX) return;
  TX.push(ok?'COMMIT;':'ROLLBACK;');
  SQL.push({title,ok,note,who:`${personName(S.user.user_ID)} (${ROLE_TH[S.user.role]})`,stmts:TX});
  TX=null;
}
function dbInsert(t,row){DB[t].push(row);rec(insSql(t,row));return row}
function setCol(t,id,col,val){get(t,id)[col]=val;rec(`UPDATE ${t}\nSET ${col} = ${q(val)}\nWHERE ${SCHEMA[t].pk} = ${q(id)};`)}
function addHistory(aid,o,n,by){return dbInsert('appeal_status_history',{history_ID:nid('appeal_status_history'),appeal_ID:aid,changed_by:by,old_status:o,new_status:n})}
function notify(uid,aid,msg){return dbInsert('notification',{notification_ID:nid('notification'),appeal_ID:aid,user_id:uid,massage:msg,is_read:false})}

/* ---- joins ---- */
function ctx(enr){
  const off=get('course_offering',enr.offering_ID);
  return {enr,off,c:get('course',off.course_ID),t:get('Teachers',off.teacher_ID),
          st:get('course_status',off.course_status_id),s:get('student',enr.student_ID)};
}
function personName(uid){
  const t=DB.Teachers.find(x=>x.user_ID==uid); if(t) return `อ.${t.First_Name} ${t.Last_Name}`;
  const s=DB.student.find(x=>x.user_ID==uid); if(s) return `${s.First_Name} ${s.Last_Name}`;
  return 'เจ้าหน้าที่ทะเบียน';
}
const myStudent = () => DB.student.find(s=>s.user_ID==S.user.user_ID);
const myTeacher = () => DB.Teachers.find(t=>t.user_ID==S.user.user_ID);
const appealCtx = a => ctx(get('enrollment',a.enrollment_ID));
function visibleAppeals(){
  const u=S.user;
  return DB.grade_appeals.filter(a=>{
    const c=appealCtx(a);
    if(u.role==='student') return c.s.user_ID==u.user_ID;
    if(u.role==='teacher') return c.t.user_ID==u.user_ID;
    return true;
  });
}
const unread = () => DB.notification.filter(n=>n.user_id==S.user.user_ID && !n.is_read).length;
function needsMe(a){const r=S.user.role;if(r==='staff')return a.status==='pending';if(r==='teacher')return a.status==='reviewing';return false}

/* ---- business rules (สิ่งที่ฐานข้อมูลต้องปฏิเสธ) ---- */
function validateAppeal(enr){
  const off=get('course_offering',enr.offering_ID);
  const dupAp=DB.grade_appeals.find(a=>a.enrollment_ID==enr.enrollment_ID && a.status!=='cancelled');
  if(dupAp)
    return {rule:'ห้ามมีคำร้องซ้ำของวิชาเดิมที่ยังไม่ยกเลิก',code:'ERROR 1644 (45000)',
      msg:`มีคำร้อง #${dupAp.appeals_ID} ของวิชานี้ที่ยังไม่ยกเลิกอยู่แล้ว (status = ${dupAp.status})`};
  if(off.course_status_id!=2)
    return {rule:'ยื่นได้เฉพาะวิชาที่ประกาศเกรดแล้ว (course_status_id = 2)',code:'ERROR 1644 (45000)',
      msg:`ยื่นคำร้องไม่ได้ เพราะรายวิชานี้มี course_status_id = ${off.course_status_id} (${get('course_status',off.course_status_id).status_name})`};
  if(enr.grade===null||enr.grade===undefined)
    return {rule:'ต้องมีเกรดจึงจะยื่นได้',code:'ERROR 1048 (23000)',msg:`Column 'grade_at_request' cannot be null`};
  return null;
}

/* ---- snapshot diff ---- */
function diffRows(t){
  const pk=SCHEMA[t].pk, m=new Map(BASE[t].map(r=>[r[pk],JSON.stringify(r)]));
  return DB[t].map(r=>{const b=m.get(r[pk]);return b===undefined?'new':(b!==JSON.stringify(r)?'chg':'')});
}

async function connectUser(authUser){
  try{
    const {data:user,error}=await supabase.from('users').select('*').eq('auth_user_id',authUser.id).single();
    if(error) throw error;
    await loadRemoteData();
    S.user=fromRemote('User',user); S.filter=S.user.role==='staff'?'pending':'all';
    S.tab={student:'grades',teacher:'appeals',staff:'appeals'}[S.user.role]; render();
  }catch(error){
    await supabase.auth.signOut();
    $('#app').innerHTML=loginView();
    $('#lerr').textContent='ยังไม่พบบัญชีในฐานข้อมูล หรือยังตั้งค่า schema ไม่ครบ: '+(error.message||'ตรวจสอบการตั้งค่า Supabase');
  }
}
async function doLogin(email,password){
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error){$('#lerr').textContent='เข้าสู่ระบบไม่สำเร็จ: '+error.message;return}
  await connectUser(data.user);
}
async function doSignup(email,password){
  const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.href,data:{first_name:$('#firstName').value.trim(),last_name:$('#lastName').value.trim()}}});
  if(error){$('#lerr').textContent='สร้างบัญชีไม่สำเร็จ: '+error.message;return}
  if(data.session) await connectUser(data.user);
  else $('#lerr').textContent='สร้างบัญชีแล้ว กรุณายืนยันอีเมลจากกล่องจดหมายก่อนเข้าสู่ระบบ';
}

function eligibleEnrollments(){
  const me=myStudent();
  return DB.enrollment.filter(e=>e.student_ID==me.student_ID && e.grade && get('course_offering',e.offering_ID).course_status_id==2 && !DB.grade_appeals.some(a=>a.enrollment_ID==e.enrollment_ID && a.status!=='cancelled'));
}
function gradeCell(r){
  const ap=DB.grade_appeals.filter(a=>a.enrollment_ID==r.enr.enrollment_ID).sort((x,y)=>y.appeals_ID-x.appeals_ID)[0];
  const g=r.enr.grade;
  if(g===null||g===undefined) return {html:'<span class="grade" style="color:var(--muted)">—</span>',note:'<span style="color:var(--muted);font-size:13px">ยังไม่ประกาศเกรด</span>',ap};
  let html=`<span class="grade">${g}</span>`, note='';
  if(ap){
    if(ap.status==='approved'){html=`<span class="old-g">${ap.grade_at_request}</span> → <span class="grade new-g">${g}</span>`;note='<span class="pill p-approved">แก้ไขเกรดแล้ว</span>'}
    else if(ap.status==='rejected'){note='<span class="pill p-rejected">ไม่อนุมัติ · คงเกรดเดิม</span>'}
    else note=`<span class="pill p-${ap.status}">${STATUS[ap.status]}</span>`;
  }
  return {html,note,ap};
}
function vGrades(){
  const u=S.user; let rows,sub,hint='',stats='';
  if(u.role==='student'){
    const me=myStudent();
    rows=DB.enrollment.filter(e=>e.student_ID==me.student_ID);
    sub=`${esc(me.First_Name)} ${esc(me.Last_Name)} · รหัส ${me.student_ID} · ชั้นปีที่ ${me.study_year}`;
    hint='เมื่อประกาศเกรดแล้ว กด “ยื่นคำร้องใหม่” เพื่อเลือกวิชาและส่งให้เจ้าหน้าที่และอาจารย์ผู้สอนตรวจสอบ ถ้าอนุมัติเกรดจะถูกแก้ไข ถ้าไม่อนุมัติจะคงเกรดเดิม';
    const GP={'A':4,'B+':3.5,'B':3,'C+':2.5,'C':2,'D+':1.5,'D':1,'F':0};
    let pts=0,cr=0; rows.forEach(e=>{if(e.grade&&e.grade in GP){const cc=get('course',get('course_offering',e.offering_ID).course_ID).course_credit;pts+=GP[e.grade]*cc;cr+=cc}});
    const gpa=cr?(pts/cr).toFixed(2):'—';
    const pub=rows.filter(e=>e.grade&&get('course_offering',e.offering_ID).course_status_id==2).length;
    const done=rows.filter(e=>DB.grade_appeals.some(a=>a.enrollment_ID==e.enrollment_ID && a.status!=='cancelled')).length;
    stats=`<div class="stats"><div class="stat"><b>${rows.length}</b><span>วิชาที่ลงทะเบียน</span></div><div class="stat"><b>${gpa}</b><span>เกรดเฉลี่ย (GPA)</span></div><div class="stat"><b>${pub}</b><span>ประกาศเกรดแล้ว</span></div><div class="stat"><b>${done}</b><span>ยื่นคำร้องแล้ว</span></div><div class="stat"><b>${eligibleEnrollments().length}</b><span>ยื่นคำร้องได้</span></div></div>`;

}

function drawFiles(){

function errBoxHtml(err,sqlText,extra=''){
  return `<div class="errbox"><b>ระบบปฏิเสธรายการ · ${esc(err.rule)}</b><div class="mono">${esc(err.code)}: ${esc(err.msg)}</div>${sqlText?`<pre>${esc(sqlText)}\n-- ผลลัพธ์: ROLLBACK ไม่มีข้อมูลถูกเปลี่ยนแปลง</pre>`:''}${extra}</div>`;

async function submitAppeal(){
  const sel=$('#enrSel'); if(!sel||!sel.value){toast('กรุณาเลือกวิชาที่ต้องการยื่น');return}
  const reason=$('#reason').value.trim();
  if(reason.length<10){toast('กรุณาระบุเหตุผลอย่างน้อย 10 ตัวอักษร');return}
  const paths=[]; const uploaded=[];
  for(const f of S.files){
    if(!f.file){$('#modalErr').innerHTML='<div class="errbox">กรุณาเลือกไฟล์ใหม่จากอุปกรณ์อีกครั้ง</div>';return}
    if(f.file.size>10*1024*1024){$('#modalErr').innerHTML=`<div class="errbox">ไฟล์ ${esc(f.file_name)} มีขนาดเกิน 10 MB</div>`;return}
    const safeName=f.file.name.replace(/[^\p{L}\p{N}._-]/gu,'_');
    const path=`${S.user.user_ID}/${crypto.randomUUID()}-${safeName}`;
    const {error:uploadError}=await supabase.storage.from('appeal-evidence').upload(path,f.file,{contentType:f.file.type,upsert:false});
    if(uploadError){if(uploaded.length)await supabase.storage.from('appeal-evidence').remove(uploaded);$('#modalErr').innerHTML=`<div class="errbox">อัปโหลดไฟล์ไม่สำเร็จ: ${esc(uploadError.message)}</div>`;return}
    uploaded.push(path);paths.push({file_name:f.file_name,file_type:f.file_type,storage_path:path});
  }
  const {data:aid,error}=await supabase.rpc('submit_appeal',{p_enrollment_id:Number(sel.value),p_reason:reason,p_files:paths});
  if(error){if(uploaded.length)await supabase.storage.from('appeal-evidence').remove(uploaded);$('#modalErr').innerHTML=`<div class="errbox"><b>ส่งคำร้องไม่สำเร็จ</b>${esc(error.message)}</div>`;return}
  try{await loadRemoteData()}catch(e){toast('บันทึกแล้ว แต่โหลดข้อมูลล่าสุดไม่สำเร็จ');return}
  closeModal(); S.tab='appeals'; render(); appealModal(Number(aid)); toast(`ส่งคำร้อง #${aid} และบันทึกลงฐานข้อมูลแล้ว`);
}
async function downloadAttachment(path){
  const {data,error}=await supabase.storage.from('appeal-evidence').createSignedUrl(path,60);
  if(error){toast('เปิดไฟล์ไม่ได้: '+error.message);return}
  const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener';a.click();
}

/* ============ APPEAL DETAIL ============ */
function progressHtml(a){
  const rev=DB.appeal_reviews.some(r=>r.appeal_id==a.appeals_ID), st=a.status;
  if(st==='cancelled') return `<div class="steps"><div class="step done">1 ยื่นคำร้อง</div><div class="step bad">2 ยกเลิกโดยนักศึกษา</div><div class="step">3 —</div></div>`;
  let s2,s3='';
  if(st==='pending')s2='now'; else if(st==='reviewing'){s2='done';s3='now'} else if(st==='approved'){s2='done';s3='done'} else if(rev){s2='done';s3='bad'} else s2='bad';
  const l2=(st==='rejected'&&!rev)?'เจ้าหน้าที่ไม่ผ่าน':'เจ้าหน้าที่ยืนยัน';
  const l3=st==='approved'?'อาจารย์อนุมัติ':(st==='rejected'&&rev?'อาจารย์ไม่อนุมัติ':'อาจารย์พิจารณา');
  return `<div class="steps"><div class="step done">1 ยื่นคำร้อง</div><div class="step ${s2}">2 ${l2}</div><div class="step ${s3}">3 ${l3}</div></div>`;
}
function hintFor(a){
  const r=S.user.role; let m='';
  if(r==='staff'&&a.status==='pending') m='ตรวจสอบเหตุผลและหลักฐาน แล้วกดยืนยันเพื่อส่งต่ออาจารย์ผู้สอน หรือกดไม่ผ่านหากข้อมูลไม่ครบ';
  else if(r==='teacher'&&a.status==='pending') m='คำร้องนี้ยังรอเจ้าหน้าที่ยืนยัน จึงยังพิจารณาไม่ได้';
  else if(r==='student'&&a.status==='pending') m='เจ้าหน้าที่กำลังตรวจสอบเอกสารของคุณ อาจารย์ผู้สอนมองเห็นคำร้องนี้แล้ว · ยังยกเลิกคำร้องได้จนกว่าอาจารย์จะตัดสิน';
  else if(r==='student'&&a.status==='reviewing') m='ผ่านการยืนยันจากเจ้าหน้าที่แล้ว กำลังรออาจารย์พิจารณา · ยังยกเลิกคำร้องได้จนกว่าอาจารย์จะตัดสิน';
  else if(a.status==='cancelled') m=r==='student'?'คุณยกเลิกคำร้องนี้แล้ว สามารถยื่นคำร้องใหม่สำหรับวิชานี้ได้':'นักศึกษายกเลิกคำร้องนี้แล้ว ไม่ต้องดำเนินการต่อ';

function cancelRule(a){

  if(a.status==='cancelled') return {rule:'คำร้องนี้ถูกยกเลิกไปแล้ว',code:'ERROR 1644 (45000)',msg:`คำร้อง #${a.appeals_ID} ถูกยกเลิกแล้ว`};
  return null;
}
function cancelAsk(aid){
  const box=$('#cancelBox'); if(!box) return;
  box.innerHTML=`<div class="errbox"><b>ยืนยันการยกเลิกคำร้อง #${aid}?</b>หลังยกเลิก เจ้าหน้าที่และอาจารย์จะไม่พิจารณาคำร้องนี้อีก คุณสามารถยื่นคำร้องใหม่สำหรับวิชานี้ได้ภายหลัง<div class="actions" style="margin-top:10px"><button class="btn" data-act="cancelNo">ไม่ยกเลิก</button><button class="btn no" data-act="cancelDo" data-id="${aid}">ยืนยันยกเลิกคำร้อง</button></div></div>`;

async function cancelAppeal(aid){
  const a=get('grade_appeals',aid), c=appealCtx(a);
  if(c.s.user_ID!=S.user.user_ID){toast('ยกเลิกได้เฉพาะคำร้องของตัวเอง');return}
  const err=cancelRule(a);
  if(err){
    beginTx(); rec(`UPDATE grade_appeals\nSET status = 'cancelled'\nWHERE appeals_ID = ${aid};`);
    endTx(`นักศึกษายกเลิกคำร้อง #${aid} (ถูกปฏิเสธ)`,false,err.msg);
    toast(err.msg); render(); appealModal(aid); return;
  }
  const {error}=await supabase.from('grade_appeals').update({status:'cancelled'}).eq('appeals_id',aid);
  if(error){toast('ยกเลิกไม่สำเร็จ: '+error.message);return}
  await loadRemoteData(); render(); appealModal(aid); toast('ยกเลิกและบันทึกสถานะแล้ว');
}
function attemptCancelFinal(){
  const ap=DB.grade_appeals.find(a=>appealCtx(a).s.user_ID==S.user.user_ID && ['approved','rejected'].includes(a.status));
  if(!ap){S.ruleOut='<div class="box">บัญชีนี้ไม่มีคำร้องที่อาจารย์ตัดสินแล้ว ลองใช้บัญชี 6401001 (คำร้อง #1 อนุมัติแล้ว)</div>';render();return}
  const err=cancelRule(ap), sqlText=`UPDATE grade_appeals\nSET status = 'cancelled'\nWHERE appeals_ID = ${ap.appeals_ID};`;
  beginTx(); rec(sqlText);
  endTx(`ทดสอบกฎ: ยกเลิกหลังอาจารย์ตัดสิน (#${ap.appeals_ID})`,false,err.msg);
  S.ruleOut=errBoxHtml(err,sqlText,`<div style="margin-top:8px;color:var(--ink)">สถานะคำร้อง #${ap.appeals_ID} ยังเป็น ${ap.status} (ไม่เปลี่ยน)</div>`);

}

function attemptViolation(kind){
  if(kind==='cancelFinal') return attemptCancelFinal();
  const me=myStudent(), mine=DB.enrollment.filter(e=>e.student_ID==me.student_ID);
  const enr = kind==='dup'
    ? mine.find(e=>DB.grade_appeals.some(a=>a.enrollment_ID==e.enrollment_ID && a.status!=='cancelled'))
    : mine.find(e=>get('course_offering',e.offering_ID).course_status_id!=2);
  if(!enr){
    S.ruleOut=`<div class="box">${kind==='dup'?'คุณยังไม่เคยยื่นคำร้อง ให้ยื่นคำร้องก่อน แล้วกลับมาลองยื่นซ้ำ':'บัญชีนี้ไม่มีวิชาที่ยังไม่ประกาศเกรด ลองใช้บัญชี 6401001 หรือ 6401002'}</div>`;
    render(); return;
  }
  const c=ctx(enr), before=DB.grade_appeals.length;
  const row={appeals_ID:nid('grade_appeals'),enrollment_ID:enr.enrollment_ID,grade_at_request:enr.grade,reason:'ทดสอบกฎระบบ',status:'pending'};
  beginTx(); rec(insSql('grade_appeals',row));
  const err=validateAppeal(enr);
  endTx(`ทดสอบกฎ: ${kind==='dup'?'ยื่นซ้ำ':'ยื่นก่อนประกาศเกรด'} (${c.c.course_code})`,false,err.msg);
  S.ruleOut=errBoxHtml(err,insSql('grade_appeals',row),`<div style="margin-top:8px;color:var(--ink)">จำนวนแถวใน grade_appeals: ก่อน ${before} → หลัง ${DB.grade_appeals.length} (ไม่เปลี่ยน)</div>`);
  render(); toast('ระบบปฏิเสธรายการ และไม่มีข้อมูลถูกเพิ่ม');
}

/* ============ SQL LOG ============ */
function reportSql(){
  const sid=S.user.role==='student'?myStudent().student_ID:6401001;
  return `-- หน้าประกาศเกรด (นักศึกษารหัส ${sid})
SELECT c.course_code, c.course_name, o.semester, o.academic_year,
       e.grade, a.grade_at_request, a.status
FROM enrollment e
JOIN course_offering o ON o.offering_ID = e.offering_ID
JOIN course c          ON c.course_ID   = o.course_ID
LEFT JOIN grade_appeals a ON a.enrollment_ID = e.enrollment_ID
WHERE e.student_ID = ${sid};

-- รายงานสรุปคำร้องแยกตามรายวิชา
SELECT c.course_code, o.semester, o.academic_year,
       COUNT(*)                  AS total,
       SUM(a.status='pending')   AS pending,
       SUM(a.status='reviewing') AS reviewing,
       SUM(a.status='approved')  AS approved,
       SUM(a.status='rejected')  AS rejected
FROM grade_appeals a
JOIN enrollment e      ON e.enrollment_ID = a.enrollment_ID
JOIN course_offering o ON o.offering_ID   = e.offering_ID
JOIN course c          ON c.course_ID     = o.course_ID
GROUP BY o.offering_ID, c.course_code, o.semester, o.academic_year;

-- ประวัติการแก้ไขเกรด
SELECT h.appeal_ID, s.First_Name, c.course_code, h.old_grade, h.new_grade, h.changed_by
FROM grade_history h
JOIN enrollment e      ON e.enrollment_ID = h.enrollment_ID
JOIN student s         ON s.student_ID    = e.student_ID
JOIN course_offering o ON o.offering_ID   = e.offering_ID
JOIN course c          ON c.course_ID     = o.course_ID;`;
}

  return `<div class="h-row"><div><h2>ฐานข้อมูล</h2><p>ตารางทั้ง 14 ตารางตามแผนภาพ ER · แถวสีเขียว = เพิ่มใหม่ แถวสีเหลือง = แก้ไข (เทียบกับจุดเริ่มต้น)</p></div>
  <button class="btn sm" data-act="snapshot">ตั้งจุดเริ่มต้นใหม่ (ก่อนทำ)</button></div>
  <div class="box" style="margin-bottom:12px">${totalChg?`เปลี่ยนแปลงจากจุดเริ่มต้น <b>${totalChg} แถว</b> ใน <b>${tblChg} ตาราง</b>`:'ยังไม่มีการเปลี่ยนแปลงจากจุดเริ่มต้น กดยื่นคำร้องหรือยืนยันคำร้อง แล้วกลับมาดูที่นี่'}</div>
  <div class="tabs2">${names.map(n=>`<button class="chip" aria-pressed="${S.tbl===n}" data-act="tbl" data-v="${n}">${n} (${DB[n].length})${cnt(n)?`<span class="dchip">+${cnt(n)}</span>`:''}</button>`).join('')}</div>
  <div class="panel tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${sc.cols.length}">ไม่มีข้อมูล</td></tr>`}</tbody></table></div>`;
}
function vEr(){
  return `<div class="h-row"><div><h2>โครงสร้าง ER</h2><p><span class="k-pk">PK</span> คีย์หลัก · <span class="k-fk">FK</span> คีย์นอก</p></div></div>
  <div class="ent-grid">${Object.entries(SCHEMA).map(([n,s])=>`<div class="panel ent"><h3>${n}</h3><ul>${s.cols.map(c=>`<li>${c===s.pk?'<span class="k-pk">PK</span> ':s.fk[c]?'<span class="k-fk">FK</span> ':'<span style="display:inline-block;width:20px"></span> '}${c}${s.fk[c]&&c!=='file_name'?` <span style="color:var(--muted)">→ ${s.fk[c]}</span>`:''}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="h-row" style="margin-top:26px"><div><h2>ความสัมพันธ์</h2><p>ตามเส้นเชื่อมและตัวเลข 1 / N ในแผนภาพ</p></div></div>
  <div class="panel">${RELS.map(r=>`<div class="rel"><div class="a">${r[0]}</div><div class="c">${r[1]} : ${r[2]}</div><div>${r[3]}<small>ผ่าน ${r[4]}</small></div></div>`).join('')}</div>`;
}

/* ============ EVENTS ============ */
const H = {
  toggleSignup:()=>{S.signup=!S.signup;$('#signupFields').classList.toggle('hidden',!S.signup);$('#firstName').required=S.signup;$('#lastName').required=S.signup;$('#loginSubmit').textContent=S.signup?'สร้างบัญชี':'เข้าสู่ระบบ';$('#signupToggle').textContent=S.signup?'กลับไปเข้าสู่ระบบ':'สร้างบัญชีนักศึกษา';$('#pw').setAttribute('autocomplete',S.signup?'new-password':'current-password');$('#lerr').textContent=''},
  logout:async()=>{await supabase.auth.signOut();S.user=null;DB=seed();render()},
  tab:b=>{S.tab=b.dataset.tab;S.filter=(S.user.role==='staff'&&b.dataset.tab==='appeals')?'pending':'all';render()},
  filter:b=>{S.filter=b.dataset.v;render()},
  tbl:b=>{S.tbl=b.dataset.v;render()},
  open:b=>appealModal(+b.dataset.id),
  close:closeModal,
  newAppeal:b=>newAppealModal(+b.dataset.id),
  newAppealPick:()=>newAppealModal(),
  downloadAttach:b=>downloadAttachment(b.dataset.path),
  rmFile:b=>{S.files.splice(+b.dataset.id,1);drawFiles()},
  submitAppeal,
  staffConfirm:b=>staffConfirm(+b.dataset.id),
  staffReject:b=>staffReject(+b.dataset.id),
  decide:b=>decideAppeal(+b.dataset.id),
  viol:b=>attemptViolation(b.dataset.k),
  cancelAsk:b=>cancelAsk(+b.dataset.id),
  cancelNo:()=>{const bx=$('#cancelBox');if(bx)bx.innerHTML=''},
  cancelDo:b=>cancelAppeal(+b.dataset.id),
  cancelList:b=>{appealModal(+b.dataset.id);cancelAsk(+b.dataset.id)},
  snapshot:()=>{BASE=JSON.parse(JSON.stringify(DB));render();toast('ตั้งจุดเริ่มต้นใหม่แล้ว การเปลี่ยนแปลงหลังจากนี้จะถูกไฮไลต์')},
  readNotif:async b=>{const n=get('notification',+b.dataset.id);const {error}=await supabase.from('notifications').update({is_read:true}).eq('notification_id',n.notification_ID);if(error){toast('อัปเดตไม่สำเร็จ: '+error.message);return}await loadRemoteData();render();appealModal(n.appeal_ID)},
  readAll:async()=>{const {error}=await supabase.from('notifications').update({is_read:true}).eq('user_id',S.user.user_ID);if(error){toast('อัปเดตไม่สำเร็จ: '+error.message);return}await loadRemoteData();render()}
};
document.addEventListener('click',e=>{
  if(e.target===$('#ov')){closeModal();return}
  const b=e.target.closest('[data-act]'); if(b&&H[b.dataset.act]) H[b.dataset.act](b);
});
document.addEventListener('submit',e=>{
  if(e.target.id==='lf'){e.preventDefault();S.signup?doSignup($('#un').value.trim(),$('#pw').value):doLogin($('#un').value.trim(),$('#pw').value)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileIn'){
    [...t.files].forEach(f=>{const ext=(f.name.split('.').pop()||'file').toLowerCase();S.files.push({file_name:f.name,file_type:ext,file:f})});
    t.value='';drawFiles();
  }
  if(t.name==='dec'){$('#ngWrap').classList.toggle('hidden',t.value!=='approved')}
  if(t.id==='enrSel'){showEnrInfo()}
  if(t.dataset.chg==='offstatus'){
    supabase.from('course_offerings').update({course_status_id:Number(t.value)}).eq('offering_id',Number(t.dataset.id)).then(async({error})=>{if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return}await loadRemoteData();render();toast('บันทึกสถานะรายวิชาแล้ว')});
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
supabase.auth.getSession().then(({data,error})=>{
  if(error){$('#app').innerHTML=loginView();$('#lerr').textContent=error.message;return}
  if(data.session) connectUser(data.session.user);
}).catch(error=>{ $('#app').innerHTML=loginView(); $('#lerr').textContent=error.message||'เชื่อมต่อ Supabase ไม่สำเร็จ'; });
</script>
</body>
</html>
